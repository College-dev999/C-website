<! DOCTYPE html>
<html lang="th">
<head>
<meta charset="-8">
<title>Estimate Pro - ระบบประเมิณราคาซ่อม</title>
<style>
    /* css แต่งหน้าเว็บ */
    body { font-family: 'Sarabun', sans-serif; background-color: #4f4f4f;
    text-align: center; padding: 30px; }
    .card {background: white; padding: 20px; border-radius: 15px; display: inline-block; width: 90%; max-width: 400px; }
    h2 { color: #2c3e90; }
    .item { display: flex; justify-content:  space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
    .btn-cale { width: 100%; padding: 15px; background: #27ae00; color: white; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 20px; }
  </style>
</head>
<body>
    <div class="card">
        <h2> ประเมิณค่าซ่อม</h2>
        <p>เลือกรายการที่ต้องการซ่อม</p>
        <div class="item">
            <label>ยางรถยนต์ (เส้นละ 2,500)</label>
            <input type="number"
            id="tire" value="0" min="0" style="width: 50px;">
        </div>
        <div class="item">
            <label> น้ำมันเครื่อง(800)</label>
            <input type="checkbox" id="oil" value="800">
        </div>
        <div class="item">
            <label>แบตเตอรี่(1800)</label>
            <input type="checkbox" id="battery" value="1800">
        </div>
        <button class="btn-calc" onclick="calculateTotal()">คำนวณราคาสุทธิ</button>
        <div id="result">รวม: 0 บาท</div>
    </div>
    <script>
        function calculateTotal() { let tirePrice =document.getElementById('tire').value * 2500;
        let oilPrice =document.getElementById('oil').checked ? 800 : 0 ;
        let batteryPrice =document.getElementById('battery').checked ? 1800 : 0;
        let total = tirePrice + oilPrice + batteryPrice;
        document.getElementById('result').innerText = "รวมทั้งสิ้น: " + total.toLocaleString() + " บาท";
        }
    </script>
</body>
</html>
